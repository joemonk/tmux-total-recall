name: Generate Demo GIF

on:
  push:
    paths:
      - 'demo.tape'
      - '.github/workflows/demo.yml'
  workflow_dispatch:

jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux fzf ffmpeg ttyd

      - name: Install VHS
        run: |
          VHS_VERSION=$(curl -s https://api.github.com/repos/charmbracelet/vhs/releases/latest | grep tag_name | cut -d'"' -f4)
          curl -sL "https://github.com/charmbracelet/vhs/releases/download/${VHS_VERSION}/vhs_${VHS_VERSION#v}_Linux_x86_64.tar.gz" | tar xz -C /tmp
          sudo mv /tmp/vhs /usr/local/bin/vhs

      - name: Setup plugin and sample data
        run: |
          mkdir -p ~/.tmux/plugins/tmux-total-recall
          cp -r . ~/.tmux/plugins/tmux-total-recall/
          cat > ~/.tmux.conf << 'EOF'
          set -g prefix C-b
          set -g @total-recall-cache-file "$HOME/.total-recall-demo"
          run-shell "$HOME/.tmux/plugins/tmux-total-recall/total-recall.tmux"
          EOF
          printf 'deploy-prod = "Deploy to production"\ndb-backup = "Database backup"\nopenstack server list\nkubectl get pods --all-namespaces\n' > ~/.total-recall-demo

      - name: Record demo
        run: vhs demo.tape

      - name: Commit GIF to repo
        run: |
          git config user.name "Matt Rooney"
          git config user.email "joemonk@gmail.com"
          git add demo.gif
          git diff --staged --quiet || git commit -m "docs: update demo gif"
          git push
